; Spotify album-art LED display
; Hardware: Seengreat RGB Matrix HUB75 S3 (ESP32-S3-WROOM-1 N16R8) + 64x64 P3 HUB75E panel
;
;   pio run -e hub75-s3 -t upload   build and flash the firmware
;   pio device monitor              serial log
;   pio test -e native              run the unit tests on your computer

[platformio]
; `pio run` builds the firmware only; the native env is for `pio test -e native`.
default_envs = hub75-s3

[env:hub75-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; N16R8 module: 16 MB flash, 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

lib_deps =
  mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.1.0
  adafruit/Adafruit GFX Library@^1.13.0
  bblanchon/ArduinoJson@^7.4.3
  bodmer/TJpg_Decoder@^1.1.0

; Desktop environment for the hardware-independent logic in lib/ledcore.
[env:native]
platform = native
; Firmware sources need the ESP32 toolchain; only lib/ledcore is built and tested here.
build_src_filter = -<*>
build_flags = -std=gnu++17 -Wall -Wextra
test_framework = unity
